[package]
name = "keyquorum"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "keyquorum"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7.5"
blahaj = "0.6"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
