[package]
name = "keyquorum"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "keyquorum"
path = "src/lib.rs"

[features]
default = []
# Compiles mailbox-host *capabilities* (hidden `host` subcommand). This is
# not authorization: a trusted provider also needs a KeyQuorum-signed
# provider.kqcert and the matching relay private key. Default
# `cargo build --release` stays the customer edition.
provider = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:utoipa-swagger-ui",
    "dep:tracing",
    "dep:tracing-subscriber",
    "utoipa/axum_extras",
]

[[bin]]
name = "keyquorum"
path = "src/bin/keyquorum/main.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
base64 = "0.22"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7.5"
blahaj = "0.6"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", optional = true }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", optional = true, features = ["trace"] }
utoipa = "5"
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum"] }
ureq = "2"
url = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
